<style>
:root{--bg:#071226;--card:#0d1b33;--tx:#f1f6ff;--mu:#a1b0c7;--ac:#2388ff;--ac2:#20c7e8;--bd:#20385a;--ok:#43d995;--bad:#ff716e;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;color:var(--tx);font:15px system-ui,sans-serif;background:var(--bg) radial-gradient(circle at 0 0,rgba(35,136,255,.2),transparent 40%) fixed}
main{max-width:900px;margin:0 auto;padding:12px}
h1{font:800 clamp(15px,4.6vw,22px)/1.15 Montserrat,'Segoe UI',Roboto,Arial,sans-serif;letter-spacing:.03em;text-transform:uppercase;margin:0;color:#fff}h2{font-size:17px;margin:0 0 10px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0 12px;border-bottom:3px solid var(--ac);margin-bottom:12px}
.brand span{display:block;margin-top:3px;color:var(--ac2);font:600 12px Montserrat,'Segoe UI',Roboto,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:14px;padding:14px;margin-bottom:12px}
button,input,select,textarea{font:inherit;color:inherit;background:#0a172c;border:1px solid #28466d;border-radius:10px;padding:9px 12px}
button{cursor:pointer}button.p,button.on{background:linear-gradient(135deg,#1976f3,#20c7e8);border-color:transparent;color:#fff}
input,select,textarea{width:100%}label{display:block;font-size:12px;color:var(--mu);margin:8px 0 4px}
.r{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}.r button{width:auto}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd)}th{color:var(--ac2);font-size:12px;text-transform:uppercase}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.mu{color:var(--mu)}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px}.k div{background:#0a1930;border-radius:12px;padding:10px;border-bottom:3px solid var(--ac)}.k b{display:block;font-size:20px}
.lst{max-height:220px;overflow:auto;border:1px solid var(--bd);border-radius:10px;padding:6px;margin:6px 0}.ck{display:flex;gap:8px;align-items:center;margin:0;padding:5px;font-size:14px;color:var(--tx)}.ck input{width:auto}
.com{border-left:2px solid var(--ac2);padding:4px 10px;margin:6px 0;background:rgba(32,199,232,.06);border-radius:0 8px 8px 0}.lg{width:50px;height:50px;border-radius:50%;flex:none}.it{border-left:3px solid var(--ac2);padding:4px 10px;margin:12px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal em{font-style:normal;text-align:center;font-size:12px;color:var(--ac2)}
.cd{min-height:50px;border:1px solid var(--bd);border-radius:8px;padding:3px;text-align:center;font-size:13px}.cd i{display:block;font-style:normal;font-size:13px}
.cd.cl{border-color:var(--ac);background:rgba(35,136,255,.15)}.cd.ps{background:rgba(67,217,149,.2);border-color:var(--ok)}.cd.fa{background:rgba(255,113,110,.18);border-color:var(--bad)}.cd.sc{background:#26324a;color:var(--mu)}.cd.hy{outline:2px solid var(--ac2)}
.av{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--ac)}
.pf{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.pf small{display:block;color:var(--mu);font-size:11px;text-transform:uppercase}

window.sendCom=async id=>{const t=$('#ct_'+id).value.trim();if(!t)return;try{const r=doc(collection(db,'comentarios'));await setDoc(r,{id:r.id,informe:id,cod:S.sel,usuario:S.usr||'',texto:t,fecha:new Date().toISOString()});S.open=id;await loadKid()}catch(e){alert('No se pudo enviar: '+e.message)}};

window.mov=d=>{const[y,m]=S.mes.split('-').map(Number),x=new Date(y,m-1+d,1,12);S.mes=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');draw()};
const mesBar=()=>`<div class="r"><button onclick="mov(-1)">◀</button><b>${mt(S.mes)}</b><button onclick="mov(1)">▶</button></div>`;
function draw(){
 const a=S.hijos.find(h=>h.cod==S.sel);if(!a)return ui(head(out)+card('No se encontró el alumno.'));
 const T={perfil:'Perfil',mens:'Mensualidades',asis:'Asistencia',cal:'Calendario',inf:'Informe del atleta'};
 ui(head(out)+(S.hijos.length>1?`<div class="r">${S.hijos.map(h=>`<button class="${h.cod==S.sel?'p':''}" onclick="pick(${h.cod})">${esc(h.nombre.split(' ')[0])}</button>`).join('')}</div>`:'')
 +`<div class="r">${Object.keys(T).map(k=>`<button class="${k==S.tab?'on':''}" onclick="tab('${k}')">${T[k]}</button>`).join('')}</div>`+VIEW[S.tab](a))}

window.pagarCuota=async function(disc){
 try{
  const a=S.hijos.find(h=>h.cod==S.sel);
  if(!a)throw new Error('No se encontró el alumno.');
  if(a.activo===false)throw new Error('El alumno está dado de baja.');
  if(!a.plan)throw new Error('La escuela todavía no asignó un plan de pago. Avisá a la administración.');
  const token=await getIdToken(S.u,true);
  const resp=await fetch('https://opk-pagos.opk-sanjuan.workers.dev/create-preference',{
   method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
   body:JSON.stringify({cod:String(a.cod),mes:hoy.slice(0,7),disc:disc||((Array.isArray(a.disc)?a.disc:[])[0]||'')})
  });
  const data=await resp.json().catch(()=>({}));
  if(!resp.ok)throw new Error(data.error||'No se pudo iniciar el pago.');
  if(!data.init_point)throw new Error('Mercado Pago no devolvió el enlace de pago.');
  location.href=data.init_point;
 }catch(e){alert(e.message||'No se pudo iniciar el pago.')}
};

const VIEW={
perfil:a=>card(`<div class="r" style="gap:14px">${a.foto?`<img class="av" src="${esc(a.foto)}">`:''}<div><h2 style="margin:0">${esc(a.nombre)}</h2><span class="mu">Alumno N° ${a.cod} · ${a.activo===false?'Baja':'Activo'}</span></div></div><div class="pf">${[['Edad',edad(a.nac)+' años'],['Nacimiento',fd(a.nac)],['DNI',a.dni],['Categoría',a.cat],['Días de clase',a.dia],['Disciplinas',(Array.isArray(a.disc)?a.disc:[]).join(' · ')||'—'],['Obra social',a.os],['Domicilio',a.dom],['Contacto',a.tel]].map(([l,v])=>`<div><small>${l}</small>${esc(v||'—')}</div>`).join('')}</div>`),
mens:a=>{const cur=hoy.slice(0,7),p=S.pend.filter(x=>x.mes==cur),dia=+hoy.slice(8);
 const pagada=p.some(x=>x.estado=='acreditado'),revision=p.some(x=>x.estado!='acreditado'&&x.estado!='rechazado');
 const st=pagada?'<span class="ok">✔ Cuota de '+mt(cur)+' pagada</span>':revision?'<span class="mu">⏳ Cuota de '+mt(cur)+' en revisión</span>':dia>=12?'<span class="bad">Cuota de '+mt(cur)+' vencida (vencía el día 11): corresponde 10% de recargo.</span>':'<span class="bad">Cuota de '+mt(cur)+' pendiente</span> <span class="mu">· vence el día 11; desde el día 12 tiene 10% de recargo</span>';
 const disciplinas=Array.isArray(a.disc)?a.disc.filter(Boolean):[],disc=disciplinas[0]||'';
 const boton=!pagada&&!revision?(a.activo===false?'<p class="mu">Alumno inactivo: no se puede pagar.</p>':!a.plan?'<p class="bad">Tu plan de pago todavía no está asignado. Comunicate con la escuela.</p>':!disc?'<p class="bad">Tu disciplina todavía no está asignada. Comunicate con la escuela.</p>':`<div class="card" style="margin-top:12px"><b>Abonar cuota mensual</b><p class="mu">El importe se calcula automáticamente según tu plan. Vence el día 11; desde el día 12 se suma un recargo del 10%.</p><button class="p" style="width:100%;font-weight:800" onclick="pagarCuota('${esc(disc)}')">💳 PAGAR CUOTA CON MERCADO PAGO</button></div>`):'';
 const r=[...S.pend].sort((x,y)=>(y.mes+y.fecha).localeCompare(x.mes+x.fecha));
 return card(`<h2>Mensualidades</h2><p>${st}</p>${boton}<div class="w"><table><tr><th>Mes</th><th>Disciplina</th><th>Monto</th><th>Método</th><th>Fecha</th><th>Estado</th><th></th></tr>${r.map(x=>`<tr><td>${mt(x.mes)}</td><td>${esc(x.disc||'')}</td><td>${$$(x.monto)}${x.rec>0?' <span class="bad">(+10%)</span>':''}</td><td>${esc(x.met||'')}</td><td>${fd(x.fecha)}</td><td class="${x.estado=='acreditado'?'ok':'mu'}">${x.estado=='acreditado'?'Pagado':'En revisión'}</td><td>${x.estado=='acreditado'?`<button title="Descargar recibo" onclick="recibo('${x.id}')">🧾</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="mu">Sin pagos registrados.</td></tr>'}</table></div>`)},
cal:a=>{const[y,m]=S.mes.split('-').map(Number),n=new Date(y,m,0).getDate(),off=(new Date(y,m-1,1,12).getDay()+6)%7,dias=DIAS[a.dia]||[];let c='';for(let i=0;i<off;i++)c+='<span></span>';
 for(let d=1;d<=n;d++){const f=S.mes+'-'+String(d).padStart(2,'0'),dw=new Date(y,m-1,d,12).getDay(),sc=(S.asist[f]||{}).sc,cl=dias.includes(dw);let k='cd',t='&nbsp;';
  if(sc&&cl){k+=' sc';t='⛔'}else if(preS(f,a.cod)){k+=' ps';t='✔'}else if(cl){if(f<hoy){k+=' fa';t='✘'}else{k+=' cl';t='●'}}
  if(f==hoy)k+=' hy';c+=`<div class="${k}"><b>${d}</b><i>${t}</i></div>`}
 const ns=Object.keys(S.asist).filter(f=>f.startsWith(S.mes)&&S.asist[f].sc&&dias.includes(new Date(f+'T12:00').getDay())).sort();
 return card(`<h2>Calendario de clases</h2><div class="mu">Tus días: ${esc(a.dia||'—')}</div>${mesBar()}<div class="cal">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<em>${x}</em>`).join('')}${c}</div><div class="mu" style="margin-top:10px;font-size:12px">● clase programada · ✔ presente · ✘ falta · ⛔ sin clase</div>${ns.length?`<p>Días sin clase: ${ns.map(f=>fd(f).slice(0,5)+' ('+esc(S.asist[f].sc)+')').join(' · ')}</p>`:''}`)},
asis:a=>{const dias=DIAS[a.dia]||[],DN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],
 st=mes=>{const[y,m]=mes.split('-').map(Number),n=new Date(y,m,0).getDate();let dic=0,pr=0,fa=0,pg=0;const rows=[];
  for(let d=1;d<=n;d++){const f=mes+'-'+String(d).padStart(2,'0'),dw=new Date(y,m-1,d,12).getDay(),sc=(S.asist[f]||{}).sc,prog=dias.includes(dw),p=preS(f,a.cod);
   if(sc&&prog){rows.push({f,dw,e:'sc',sc});continue}
   if(p){pr++;dic++;rows.push({f,dw,e:'ps'})}
   else if(prog){if(f<hoy){fa++;dic++;rows.push({f,dw,e:'fa'})}else{pg++;rows.push({f,dw,e:'cl'})}}}
  return{dic,pr,fa,pg,rows,pct:dic?Math.round(pr*100/dic):null}},
 cur=st(S.mes),
 meses=[...new Set([...Object.keys(S.asist).map(f=>f.slice(0,7)),hoy.slice(0,7)])].filter(x=>/^\d{4}-\d{2}$/.test(x)&&x<=hoy.slice(0,7)).sort().reverse().slice(0,12).map(x=>({m:x,...st(x)})).filter(x=>x.dic>0),
 lab={ps:['ps','✔ Presente'],fa:['fa','✘ Falta'],cl:['cl','● Programada'],sc:['sc','⛔ Sin clase']},
 col=p=>p==null?'':p>=80?'ok':p>=60?'':'bad';
 return card(`<h2>Asistencia</h2><div class="mu">Tus días: ${esc(a.dia||'—')}</div>${mesBar()}
 <div class="k"><div>Presentes<b class="ok">${cur.pr}</b></div><div>Faltas<b class="${cur.fa?'bad':''}">${cur.fa}</b></div><div>Clases dictadas<b>${cur.dic}</b></div><div>Asistencia<b class="${col(cur.pct)}">${cur.pct==null?'—':cur.pct+'%'}</b></div></div>
 ${cur.pg?`<div class="mu" style="margin-bottom:8px">Clases programadas por venir este mes: ${cur.pg}</div>`:''}
 <div class="w"><table><tr><th>Fecha</th><th>Día</th><th>Estado</th></tr>${cur.rows.map(r=>`<tr><td>${fd(r.f)}</td><td>${DN[r.dw]}</td><td><span class="cd ${lab[r.e][0]}" style="display:inline-block;min-height:0;padding:2px 10px;font-weight:700">${lab[r.e][1]}${r.e=='sc'&&r.sc?' ('+esc(r.sc)+')':''}</span></td></tr>`).join('')||'<tr><td colspan="3" class="mu">Sin clases registradas en este mes.</td></tr>'}</table></div>
 <h3 style="margin:18px 0 6px">Resumen por mes</h3>
 <div class="w"><table><tr><th>Mes</th><th>Presentes</th><th>Faltas</th><th>Dictadas</th><th>Asistencia</th></tr>${meses.map(x=>`<tr onclick="irMes('${x.m}')" style="cursor:pointer${x.m==S.mes?';background:rgba(35,136,255,.15)':''}"><td>${mt(x.m)}</td><td class="ok">${x.pr}</td><td class="${x.fa?'bad':''}">${x.fa}</td><td>${x.dic}</td><td class="${col(x.pct)}"><b>${x.pct}%</b></td></tr>`).join('')||'<tr><td colspan="5" class="mu">Todavía no hay clases registradas.</td></tr>'}</table></div>`)},
inf:a=>{const r=[...S.inf].sort((x,y)=>y.fecha.localeCompare(x.fecha)),u=r[0],bl=(l,t)=>t?`<div style="margin-top:6px"><small class="mu">${l}</small><div style="white-space:pre-wrap">${esc(t)}</div></div>`:'';
 return card(`<h2>Informe del atleta</h2>`+(u?`<div class="k"><div>Nivel actual<b>${esc(u.nivel)}</b></div><div>Conducta<b style="font-size:17px">${esc(u.conducta)}</b></div><div>Último informe<b style="font-size:16px">${fd(u.fecha)}</b></div></div>`:'')+(r.map(x=>{const cm=S.com.filter(c=>c.informe==x.id).sort((p,q)=>p.fecha.localeCompare(q.fecha));return `<div class="it"><b>${esc(x.nivel)}</b> <span class="mu">· ${fd(x.fecha)} · Conducta: ${esc(x.conducta)}</span>${bl('LOGROS',x.logros)}${bl('OBJETIVOS',x.objetivos)}<div class="r"><button onclick="tg('${x.id}')">💬 Comentar${cm.length?' ('+cm.length+')':''} ▾</button></div><div id="cm_${x.id}" style="display:${S.open==x.id?'block':'none'}">${cm.map(c=>`<div class="com"><small class="mu">${esc(c.usuario||'')} · ${fh(c.fecha)}</small><div style="white-space:pre-wrap">${esc(c.texto)}</div></div>`).join('')}<textarea id="ct_${x.id}" rows="2" maxlength="600" placeholder="Escribí tu comentario…"></textarea><div class="r"><button class="p" onclick="sendCom('${x.id}')">Enviar</button></div></div></div>`}).join('')||'<span class="mu">Todavía no hay informes.</span>'))}};

/* ---------- PANEL DE ADMINISTRACIÓN (solo UIDs de administradores) ---------- */
async function adminLoad(msg){
 const g=async n=>(await getDocs(collection(db,n))).docs.map(d=>({...d.data(),_id:d.id}));
 const [al,vin,inf,com]=await Promise.all([g('alumnos'),g('vinculos'),g('informes'),g('comentarios')]);
 S.al=al.filter(a=>a.activo!==false).sort((a,b)=>a.nombre.localeCompare(b.nombre));S.vin=vin;S.inf2=inf;S.com2=com;adminV(msg)}
const nm=c=>(S.al.find(a=>a.cod==c)||{nombre:'#'+c}).nombre;
function adminV(msg){
 const opt=S.al.map(a=>`<option value="${a.cod}">${esc(a.nombre)} (#${a.cod})</option>`).join('');
 const last=(L)=>[...L].sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,10);
 ui(head(out)+(msg?card(msg):'')
 +card(`<h2>Crear o actualizar familia</h2><div class="mu">Si el usuario ya existe, solo se actualizan sus hijos. Si es nuevo, se genera un código.</div><label>Usuario (letras, números, punto o guion)</label><input id="fu"><label>Buscar alumno</label><input id="fb" oninput="fFilt()" placeholder="Nombre…"><div class="lst" id="fl">${S.al.map(a=>`<label class="ck" data-n="${esc(a.nombre.toLowerCase())}"><input type="checkbox" value="${a.cod}"> ${esc(a.nombre)} <span class="mu">#${a.cod}</span></label>`).join('')}</div><button class="p" onclick="crearFam()">Guardar familia</button>`)
 +card(`<h2>Familias (${S.vin.length})</h2><div class="w"><table><tr><th>Usuario</th><th>Hijos</th><th>Código</th><th></th></tr>${S.vin.map(v=>`<tr><td>${esc(v.usuario)}</td><td>${(v.alumnos||[]).map(c=>esc(nm(c))).join(', ')}</td><td style="white-space:nowrap">${v.codigo?`<code id="cod_${v._id}" data-c="${esc(v.codigo)}" data-v="0">••••••••</code> <button title="Ver / ocultar" onclick="verCod('${v._id}')">👁</button> <button title="Copiar" onclick="copCod('${v._id}')">📋</button>`:`<span class="mu">no guardado</span> `}<button title="${v.codigo?'Cambiar el código guardado':'Guardar el código de esta familia'}" onclick="setCod('${v._id}')">✏️</button></td><td><button onclick="delFam('${v._id}')">🗑</button></td></tr>`).join('')||'<tr><td colspan="4" class="mu">Sin familias.</td></tr>'}</table></div><div class="mu" style="margin-top:8px;font-size:12px">El código guardado es solo un recordatorio para vos: si cambia en Firebase Authentication, actualizalo con ✏️.</div>`)
 +card(`<h2>Cargar informe del atleta</h2><div class="g"><div><label>Alumno</label><select id="in_a">${opt}</select></div><div><label>Fecha</label><input id="in_f" type="date" value="${hoy}"></div><div><label>Nivel</label><select id="in_n"><option>Principiante 1</option><option>Principiante 2</option><option>Pre-intermedio</option><option>Intermedio</option><option>Avanzado</option></select></div><div><label>Conducta</label><select id="in_c"><option>Excelente</option><option>Muy buena</option><option>Buena</option><option>Regular</option><option>A mejorar</option></select></div></div><label>Logros</label><textarea id="in_l" rows="3"></textarea><label>Objetivos</label><textarea id="in_o" rows="2"></textarea><div class="r"><button class="p" onclick="addInf()">Guardar informe</button></div><div class="w"><table>${last(S.inf2).map(x=>`<tr><td>${fd(x.fecha)}</td><td>${esc(nm(x.cod))}</td><td>${esc(x.nivel)}</td><td><button onclick="delDoc('informes','${x._id}')">🗑</button></td></tr>`).join('')}</table></div>`)
 +card(`<h2>Comentarios de las familias (${S.com2.length})</h2><div class="w"><table>${[...S.com2].sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,15).map(x=>`<tr><td>${fh(x.fecha)}</td><td>${esc(nm(x.cod))}<br><span class="mu">${esc(x.usuario||'')}</span></td><td style="white-space:pre-wrap">${esc(x.texto)}</td><td><button onclick="delDoc('comentarios','${x._id}')">🗑</button></td></tr>`).join('')||'<tr><td class="mu">Sin comentarios.</td></tr>'}</table></div>`))}
window.fFilt=()=>{const t=$('#fb').value.toLowerCase();document.querySelectorAll('#fl .ck').forEach(l=>l.style.display=l.dataset.n.includes(t)?'':'none')};
const gen=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=new Uint32Array(8);crypto.getRandomValues(a);return[...a].map(x=>c[x%c.length]).join('')};
window.crearFam=async()=>{const u=$('#fu').value.trim().toLowerCase();
 if(!/^[a-z0-9._-]{3,30}$/.test(u))return alert('Usuario: 3 a 30 caracteres, solo letras minúsculas, números, punto o guion.');
 const cods=[...document.querySelectorAll('#fl input:checked')].map(x=>+x.value);if(!cods.length)return alert('Elegí al menos un alumno.');
 const ex=S.vin.find(v=>v.usuario===u);
 try{if(ex){await setDoc(doc(db,'vinculos',ex._id),{uid:ex._id,usuario:u,alumnos:cods},{merge:true});return adminLoad('Familia <b>'+esc(u)+'</b> actualizada. El código no cambió.')}
  const code=gen(),a2=initializeApp(cfg,'f'+Date.now()),au=getAuth(a2);let uid;
  try{uid=(await createUserWithEmailAndPassword(au,u+DOM,code)).user.uid}finally{try{await signOut(au)}catch(e){}await deleteApp(a2)}
  await setDoc(doc(db,'vinculos',uid),{uid,usuario:u,alumnos:cods,codigo:code});
  adminLoad('✅ Familia creada. Usuario: <b>'+esc(u)+'</b> · Código: <b style="font-size:20px">'+code+'</b><br><span class="mu">Queda guardado en la tabla de Familias (botón 👁 para verlo).</span>')
 }catch(e){alert(e.code=='auth/email-already-in-use'?'Ese usuario ya existe en Authentication sin vínculo. Borralo en Firebase → Authentication o usá otro nombre.':'No se pudo guardar: '+e.message)}};
window.verCod=id=>{const e=$('#cod_'+id);if(!e)return;const v=e.dataset.v=='1';e.textContent=v?'••••••••':e.dataset.c;e.dataset.v=v?'0':'1'};
window.copCod=async id=>{const e=$('#cod_'+id);if(!e)return;try{await navigator.clipboard.writeText(e.dataset.c);alert('Código copiado.')}catch(x){prompt('Copiá el código:',e.dataset.c)}};
window.setCod=async id=>{const c=(prompt('Escribí el código (contraseña) actual de esta familia para guardarlo:','')||'').trim();if(!c)return;try{await setDoc(doc(db,'vinculos',id),{codigo:c},{merge:true});adminLoad('Código guardado.')}catch(e){alert('No se pudo guardar: '+e.message)}};
window.delFam=async id=>{if(!confirm('¿Quitar el acceso de esta familia? (la cuenta queda en Authentication; podés borrarla desde la consola)'))return;await deleteDoc(doc(db,'vinculos',id));adminLoad('Vínculo eliminado.')};
window.delDoc=async(c,id)=>{if(!confirm('¿Eliminar?'))return;await deleteDoc(doc(db,c,id));adminLoad()};
window.addInf=async()=>{const l=$('#in_l').value.trim(),o=$('#in_o').value.trim();if(!l&&!o)return alert('Escribí logros u objetivos.');const r=doc(collection(db,'informes'));await setDoc(r,{id:r.id,cod:+$('#in_a').value,fecha:$('#in_f').value,nivel:$('#in_n').value,conducta:$('#in_c').value,logros:l,objetivos:o});adminLoad('Informe guardado.')};
</script></body></html>
